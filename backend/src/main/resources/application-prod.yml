server:
  port: ${SERVER_PORT}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate  # 실무 표준: 스키마 검증만
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false  # 운영은 처음부터 Flyway로 관리
    locations: classpath:db/migration
    validate-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000  # 1시간

logging:
  level:
    com.rental.camprent: INFO
